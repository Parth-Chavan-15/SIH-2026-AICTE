services:
  - type: web
    name: niyamsetu-aicte
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 20.18.0
