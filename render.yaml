services:
  - type: web
    name: niyamsetu-aicte
    env: node
    plan: free
    buildCommand: npm ci --include=dev --include=optional && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 22.22.0
