name: Keep NIYAMSETU Render Service Awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping NIYAMSETU health endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 --output /dev/null --write-out "HTTP status: %{http_code}\n" "https://niyamsetu-aicte.onrender.com/health"
