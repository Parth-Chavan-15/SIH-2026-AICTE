name: NiyamSetu CI & Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check TypeScript (Strict Mode)
        run: npx tsc --noEmit

      - name: Run Core Acceptance Test Suite (T01-T22)
        run: npx vitest run tests/verification_t01_t16.test.ts tests/verification_t17_t22.test.ts

      - name: Build Production Client & Server
        run: npm run build
